name: CI/CD Pipeline to AWS ECR & ECS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-2

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image to ECR
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            576738458757.dkr.ecr.ap-south-2.amazonaws.com/blog-app-backend:latest
            576738458757.dkr.ecr.ap-south-2.amazonaws.com/blog-app-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend


      - name: Deploy to Amazon ECS
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          aws ecs update-service --cluster blog-app-cluster --service blog-app-backend-service --force-new-deployment --region ap-south-2 


      # --------------------------------------------------
      # Frontend Deployment
      # --------------------------------------------------

      - name: Set up Node.js
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ./frontend
        run: npm ci

      - name: Get Current ALB URL
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: alb
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names blog-app-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text \
            --region ap-south-2)

          echo "Current ALB DNS: $ALB_DNS"

          echo "api_url=http://${ALB_DNS}/api" >> "$GITHUB_OUTPUT"

      - name: Build Frontend
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ steps.alb.outputs.api_url }}
        run: |
          echo "Building frontend with API URL: $VITE_API_URL"
          npm run build

      - name: Deploy Frontend to S3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          aws s3 sync frontend/dist/ s3://blog-app-frontend-site-2026 \
            --delete \
            --region ap-south-2
